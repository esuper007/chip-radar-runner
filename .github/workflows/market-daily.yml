name: market-daily
# Fetch the day's chip data, refresh prices, rebuild scores & forecasts, publish to `dist`.
on:
  schedule:
    - cron: "40 14 * * 1-5"   # tw  22:40 Taipei (margin data is out ~21:30)
    - cron: "30 9 * * 1-5"    # jp  18:30 Tokyo
    - cron: "30 10 * * 1-5"   # cn  18:30 Beijing
    - cron: "30 11 * * 1-5"   # hk  19:30 Hong Kong
    - cron: "30 23 * * 1-5"   # us  19:30 New York (FINRA short volume ~18:00 ET)
  workflow_dispatch:
    inputs:
      market:
        description: "tw / us / jp / hk / cn"
        default: tw
        required: true
      force:
        description: "datasets to re-download for the last 7 days, comma separated (e.g. inst,daytrade)"
        default: ""
        required: false
permissions:
  contents: write
  actions: write
concurrency:
  # one run per market at a time; markets run in parallel (publish_dist.sh merges safely)
  group: market-${{ github.event.inputs.market || (github.event.schedule == '30 9 * * 1-5' && 'jp') || (github.event.schedule == '30 10 * * 1-5' && 'cn') || (github.event.schedule == '30 11 * * 1-5' && 'hk') || (github.event.schedule == '30 23 * * 1-5' && 'us') || 'tw' }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # data (Release store + dist branch) lives in a PRIVATE repo; this public repo only has code
      DATA_REPO: ${{ vars.DATA_REPO || 'esuper007/chip-radar' }}
      DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      GH_TOKEN: ${{ secrets.DATA_TOKEN }}
      GH_REPO: ${{ vars.DATA_REPO || 'esuper007/chip-radar' }}
      SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
      FORCE_DATASETS: ${{ github.event.inputs.force }}
      MARKET: ${{ github.event.inputs.market || (github.event.schedule == '30 9 * * 1-5' && 'jp') || (github.event.schedule == '30 10 * * 1-5' && 'cn') || (github.event.schedule == '30 11 * * 1-5' && 'hk') || (github.event.schedule == '30 23 * * 1-5' && 'us') || 'tw' }}
      LOG_FILE: dist/_logs/${{ github.event.inputs.market || (github.event.schedule == '30 9 * * 1-5' && 'jp') || (github.event.schedule == '30 10 * * 1-5' && 'cn') || (github.event.schedule == '30 11 * * 1-5' && 'hk') || (github.event.schedule == '30 23 * * 1-5' && 'us') || 'tw' }}.log
    steps:
      - name: Check secrets
        run: '[ -n "$DATA_TOKEN" ] || { echo "::error::DATA_TOKEN secret is missing"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: "${{ env.DATA_REPO }}", token: "${{ secrets.DATA_TOKEN }}", ref: dist, path: dist }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: rm -f dist/_logs/$MARKET.log
      - name: Fetch today's chip data
        run: python -m pipeline.run daily $MARKET
      - name: Update prices
        run: python -m pipeline.run prices $MARKET
      - name: Build scores and forecasts
        run: python -m pipeline.run build $MARKET
      - name: Publish dist branch
        run: bash scripts/publish_dist.sh
