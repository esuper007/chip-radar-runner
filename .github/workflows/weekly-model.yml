name: weekly-model
# Saturday: full walk-forward backtest (model quality shown on the dashboard) + rebuild.
on:
  schedule:
    - cron: "0 2 * * 6"   # Sat 10:00 Taipei
  workflow_dispatch:
    inputs:
      market: { description: "all / tw / us / jp / hk / cn", default: all, required: true }
permissions:
  contents: write
jobs:
  run:
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        market: ${{ fromJSON((github.event.inputs.market && github.event.inputs.market != 'all') && format('["{0}"]', github.event.inputs.market) || '["tw","us","jp","hk","cn"]') }}
    runs-on: ubuntu-latest
    concurrency:
      group: market-${{ matrix.market }}
      cancel-in-progress: false
    timeout-minutes: 340
    env:
      # data (Release store + dist branch) lives in a PRIVATE repo; this public repo only has code
      DATA_REPO: ${{ vars.DATA_REPO || 'esuper007/chip-radar' }}
      DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      GH_TOKEN: ${{ secrets.DATA_TOKEN }}
      GH_REPO: ${{ vars.DATA_REPO || 'esuper007/chip-radar' }}
      MARKET: ${{ matrix.market }}
      LOG_FILE: dist/_logs/${{ matrix.market }}-model.log
    steps:
      - name: Check secrets
        run: '[ -n "$DATA_TOKEN" ] || { echo "::error::DATA_TOKEN secret is missing"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: "${{ env.DATA_REPO }}", token: "${{ secrets.DATA_TOKEN }}", ref: dist, path: dist }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: rm -f dist/_logs/$MARKET.log
      - run: python -m pipeline.run build $MARKET --backtest --train || echo 'build failed (not enough data yet?)'
      - run: bash scripts/publish_dist.sh
